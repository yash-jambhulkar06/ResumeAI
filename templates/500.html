<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | ResumeAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 24px;
            text-align: center;
        }
        .error-card {
            max-width: 480px;
            padding: 48px 32px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
        }
        .code {
            font-size: 72px;
            font-weight: 800;
            color: #dc2626;
            line-height: 1;
            margin: 0 0 16px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 10px;
            font-weight: 700;
        }
        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 28px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="code">500</div>
        <h1>Something went wrong</h1>
        <p>Our server encountered an unexpected condition. Our team has been notified. Please try again shortly.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
